<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão Flexbox - Layout de Blocos</title>
</head>
<body>

    <header class="superior">
        <div class="caixa-top">Topo A</div>
        <div class="caixa-top">Topo B</div>
    </header>

    <main class="central">
        <section class="central-esquerda">Barra Esquerda</section>
        <section class="central-centro">Barra Central</section>
        <section class="central-direita">Barra Direita</section>
    </main>
   
    <footer class="inferior">
        <div class="caixa-bot">Card 1</div>
        <div class="caixa-bot">Card 2</div>
    </footer>

</body>
</html>
